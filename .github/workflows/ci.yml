name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # redocly/cli 2.70.0, published 2026-10-23, pinned by the digest of its image index.
      - name: Validate the OpenAPI draft
        run: docker run --rm -v "$GITHUB_WORKSPACE:/spec" -w /spec redocly/cli@sha256:f09828706881234790394d0f4032b2956c902f093e80ef08ab6ba3234c1aca7a lint openapi/latifi-api.v0.yaml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, test and lint
        run: ./mvnw -B verify

      - name: Assert the database test ran
        run: test -f target/surefire-reports/TEST-com.latifi.api.DatabaseConnectivityTest.xml

      - name: Assert the BDD suite ran
        run: |
          report=target/surefire-reports/TEST-com.latifi.api.bdd.RunCucumberTest.xml
          test -f "$report"
          grep -q '<testcase' "$report"

      - name: Self-test the image tag script
        run: bash scripts/image-tags.test.sh

      # The image that Dokploy builds from main is built here from the same Dockerfile and has to boot.
      - name: Build the container image
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t latifi-api:ci .

      - name: Smoke test the image
        run: bash scripts/image-smoke.sh latifi-api:ci

      # A signing secret under 32 bytes must stop the application, so a green smoke test means something.
      - name: Smoke test must reject a short signing secret
        run: |
          if out="$(bash scripts/image-smoke.sh --jwt-secret short latifi-api:ci 2>&1)"; then
            echo "negative smoke: the image accepted a short secret" >&2
            exit 1
          fi
          # The rejection has to come from the secret check and not from some other breakage.
          echo "$out" | grep -q 'LATIFI_JWT_SECRET is too short'
          echo "negative smoke: rejected"
