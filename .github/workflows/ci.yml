name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: latifi
          POSTGRES_USER: latifi
          # Throwaway value for the ephemeral service container. Not a secret.
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U latifi -d latifi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # redocly/cli 2.70.0, published 2026-10-23, pinned by the digest of its image index.
      - name: Validate the OpenAPI draft
        run: docker run --rm -v "$GITHUB_WORKSPACE:/spec" -w /spec redocly/cli@sha256:f09828706881234790394d0f4032b2956c902f093e80ef08ab6ba3234c1aca7a lint openapi/latifi-api.v0.yaml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, test and lint
        run: ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/latifi
          SPRING_DATASOURCE_USERNAME: latifi
          SPRING_DATASOURCE_PASSWORD: ci-throwaway-not-a-secret

      - name: Assert the database test ran
        run: test -f target/surefire-reports/TEST-com.latifi.api.DatabaseConnectivityTest.xml
