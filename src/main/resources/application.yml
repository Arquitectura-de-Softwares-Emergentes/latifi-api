spring:
  application:
    name: latifi-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/latifi}
    username: ${SPRING_DATASOURCE_USERNAME:latifi}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
