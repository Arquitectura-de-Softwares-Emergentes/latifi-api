spring:
  application:
    name: latifi-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/latifi}
    username: ${SPRING_DATASOURCE_USERNAME:latifi}
    password: ${SPRING_DATASOURCE_PASSWORD}
  messages:
    basename: messages
    fallback-to-system-locale: false

latifi:
  auth:
    domain: ${LATIFI_AUTH_DOMAIN:localhost}
    uri: ${LATIFI_AUTH_URI:http://localhost:8080}
    challenge-ttl: PT5M
  chain:
    id: 80002

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
